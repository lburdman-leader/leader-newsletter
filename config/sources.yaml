# Controlled source list.
#
# PROVISIONAL: these entrypoints are a starting set and have NOT been verified
# against the live web yet. Stage 2 verifies each one (feed availability, date
# semantics, selectors) via the /add-source skill and the source-researcher
# subagent, and only then should a source be trusted in a live run.
#
# strategy: rss | scrapling_static | scrapling_dynamic | scrapling_stealth
#   Always pick the cheapest option that actually works, in that order.
#   The strategy is static configuration; a model never chooses it at runtime.
# priority: 0-10, added directly to the deterministic score.
# category_hint: a hint for the analyzer, not the final category.
#
# selectors (scrapling_* strategies only):
#   index_item  container for one item on the index page, e.g. "article.card"
#   link        anchor inside the container, e.g. "a.card-link"  (default: "a")
#   title       optional title element inside the container
#   date        optional element holding the publication date
#   date_attr   attribute on that element to read (default: "datetime")
# options:
#   max_articles      per-source cap (default 50)
#   use_feed_content  rss only: use the body carried by the feed, skipping a fetch
#
# An item whose date cannot be read is kept, never given an invented date; the
# authoritative time filter runs in Stage 3 on the normalized article.

sources:
  # --- YouTube -----------------------------------------------------------
  - id: youtube-official-blog
    name: YouTube Official Blog
    category_hint: youtube_platform
    entrypoint: "https://blog.youtube/rss/"
    strategy: rss
    priority: 10
    enabled: true

  - id: tubefilter
    name: Tubefilter
    category_hint: youtube_monetization
    entrypoint: "https://www.tubefilter.com/feed/"
    strategy: rss
    priority: 7
    enabled: true

  # --- AI models and APIs ------------------------------------------------
