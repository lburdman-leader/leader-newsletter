  # --- AI video and creative AI -----------------------------------------
  # Disabled until Stage 2 verifies the DOM structure and date semantics;
  # scrapling is also not installed yet.
  - id: anthropic-news
    name: Anthropic News
    category_hint: ai_models
    entrypoint: "https://www.anthropic.com/news"
    strategy: scrapling_static
    priority: 9
    enabled: false
    # Selectors are placeholders until Stage 2 verification confirms the DOM.
    selectors:
      index_item: "article"
      link: "a"
      date: "time"
      date_attr: "datetime"

  - id: runway-research
