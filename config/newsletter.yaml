# Editorial policy. Cadence and thresholds are configuration, not architecture.

newsletter:
  masthead: "Leader Intelligence Semanal"
  tagline: "YouTube, contenido infantil e inteligencia artificial, cada semana"

  # IANA timezone used for the date window, issue labels and published dates.
  timezone: "America/Argentina/Buenos_Aires"

  # Default window: the 7 days up to execution time.
  #   rolling         -> [now - window_days, now)
  #   completed_days  -> whole local days only, ending at midnight today
  window_days: 7
  window_mode: rolling

  # Deterministic selection. The model never changes these.
  # Ten stories an edition: the newspaper is a bank of links, and reader
  # submissions take their slots out of these ten before the rubric fills the
  # rest (see `submissions.reserved_slots`).
  max_items: 10

  # The smallest edition worth printing. Below this the caps that RATION slots --
  # section_limits, max_per_source, max_per_subject -- are relaxed one step at a
  # time and the edition is re-seated, until it reaches six stories or no rationed
  # story is left to admit. What is never relaxed is everything that protects
  # correctness and quality: min_score, excluded_categories, the three
  # deduplication passes, both collapse passes, the "printed only once" guarantee
  # and the entity-fidelity guard. A thin week publishes short and records the
  # shortfall in `min_items_unmet`; when a cap was relaxed, `cap_relaxation` in
  # run_manifest.json names how far and to what. Nothing is ever padded.
  min_items: 6

  # Recalibrated for the v2 rubric, which asks what a story means for THIS
  # company rather than for a general tech reader. Across 43 real articles the
  # old rubric topped out at 88 and the new one at 68, so 70 published nothing.
  # 62 fills the edition from the genuinely most relevant stories (ADR-0032).
  min_score: 62

  # Collapse several articles covering the same event into one story, using the
  # analyzer event fingerprint. The collapse key is subject + object only:
  # "launches", "introduces" and "announces" are one launch, and the date is
  # stated in some reports and left null in others.
  collapse_events: true

  # Second collapse pass, for the case the fingerprint cannot reach. Each article
  # is assessed on its own, so three outlets reporting one launch can produce
  # three different subject/object pairs -- "openai / chatgpt for teens" next to
  # "chatgpt / teen accounts" -- and no exact key will ever match them. This pass
  # compares the articles themselves: rare words and proper names, weighted by how
  # unusual they are across the week's candidates, cosine-compared. Within a run
  # only, never across editions.
  collapse_similar_events: true

  # The similarity at which two candidates are one event. Measured on the real
  # 2026-W34 edition: the three ChatGPT-for-Teens reports scored 0.28, 0.34 and
  # 0.38 against each other, while the closest genuinely distinct pair among the
  # published stories scored 0.14. 0.21 sits between them with room on both sides.
  similar_event_threshold: 0.21

  # Every story is printed once, for good. A story an earlier edition carried is
  # never reprinted, matched on identity (article id, content hash, normalized
  # title) and never on topic -- so a genuine follow-up on the same company and
  # the same product still competes on its merits.
  suppress_already_published: true

  # Reader-visible prose is checked, in Python, against the text ingestion
  # collected for the story. A proper name the source never uses -- "UTube"
  # where the article said "YouTube" -- drops the story before it is edited and
  # discards the editorial polish after. No model is consulted.
  check_entity_fidelity: true

  # No single publication may fill the edition, however well it scores.
  max_per_source: 2

  # Nor may any single company, even across genuinely distinct events. This is
  # what keeps an edition heterogeneous once collapse has done its work.
  max_per_subject: 2

  # Caps that stop one topic monopolising the edition.
  # Weighted towards what this company lives on: YouTube and children's
  # content first, AI tooling and general AI business behind them.
  #
  # Rescaled for a ten-story edition. These were calibrated when max_items was 8
  # and were never revisited when it became 10, so they rationed a ten-slot paper
  # as though it had eight: on 2026-W33 eight stories cleared min_score and the
  # `ai_models: 2` cap threw five of them away, and the edition printed three.
  # The shares are what they always were -- the beat may hold up to 40% of the
  # paper, the AI categories 30% each -- expressed against ten instead of eight:
  # 3/8 becomes 4/10 and 2/8 becomes 3/10. No single category can reach half the
  # edition, and no combination of two can fill it.
  section_limits:
    youtube_platform: 4
    youtube_monetization: 4
    kids_content: 4
    ai_video: 3
    ai_models: 3
    ai_business: 3

  # The mirror image of section_limits: a named group of categories the edition
  # must carry a MINIMUM of, so a week dominated by general AI news cannot leave
  # the beat this newspaper exists for unrepresented.
  #
  # One group with a minimum of 4, and deliberately not three per-category
  # minima: the requirement is "four stories from our own beat", and one-of-each
  # would be a stricter rule the owner did not ask for. `ai_video` is not in the
  # group -- it is adjacent work, not the company's own beat.
  #
  # A floor changes WHICH stories run, never how many, and never what counts as
  # publishable: a floor story still clears min_score and still obeys every cap.
  # It is seated after the reserved submission slots and before the earned ones,
  # so it can pull a lower-scoring story in ahead of a higher-scoring one -- and
  # the story that lost the slot is named in run_manifest.json under
  # `withheld`, reason `coverage_floor`. When the week genuinely offers fewer
  # than four qualifying stories the edition publishes short and says so in
  # `coverage_floors_unmet`. Nothing is ever padded to reach a minimum.
  coverage_floors:
    own_beat:
      categories:
        - youtube_platform
        - youtube_monetization
        - kids_content
      minimum: 4

  # Publication order of the sections.
  section_order:
    - youtube_platform
    - youtube_monetization
    - kids_content
    - ai_video
    - ai_models
    - ai_business

  section_titles:
    youtube_platform: "YouTube: la plataforma"
    youtube_monetization: "YouTube: monetización"
    kids_content: "Contenido infantil y familiar"
    ai_video: "IA para video y creatividad"
    ai_models: "Herramientas y modelos de IA"
    ai_business: "IA en los negocios"

  # Valid classification, never published.
  excluded_categories:
    - other

  # How much of the week the run actually pays to assess. A real week offers
  # 130-160 candidates for an edition of ten, and one model call each is the
  # dominant cost and the dominant wait.
  #
  # The run assesses `analysis_pool_min` candidates, asks whether the edition
  # could be published as it stands -- ten stories AND every coverage floor met,
  # not merely ten of anything -- and pulls another batch of the same size only
  # while the answer is no, stopping at `analysis_pool_max`.
  #
  # Reader submissions are assessed FIRST and do not count against the cap: a
  # link a reader was promised a slot for is never crowded out by a budget.
  # The rest is ordered round-robin across sources, newest first within each, so
  # the cap trims the eleventh story from one outlet rather than every story from
  # a whole beat. Ordering by priority instead would let the priority-7 sources
  # fill the budget alone and Cartoon Brew, Tubefilter and Unite.AI would never
  # be read.
  #
  # Be honest about what this costs: a bounded pool is sampling, not exhaustive
  # rating, and a strong story deep in the order is never assessed at all.
  # Measured against the real 2026-W34 pool, 5 of the 8 published stories sat
  # beyond position 50. Set `analysis_pool_max: 0` (or leave it empty) to restore
  # exhaustive assessment of the whole pool.
  # 80, not 50. Measured against the real 2026-W34 pool: a cap of 50 keeps only
  # 3 of the 8 stories the exhaustive run published and never assesses the week's
  # best -- "Introducing ChatGPT for Teens", 82 against a next-best 72, at
  # position 71. 80 keeps 7 of 10 and still skips a third of the pool.
  analysis_pool_min: 20
  analysis_pool_max: 80

# Reader submissions: anyone can propose a link with
#   python -m newsletter submit <url> --by "name" --note "why"
# A submission is fetched, normalized, deduplicated, assessed and scored exactly
# like any other article -- and then it takes one of the edition's slots by right.
submissions:
  enabled: true
  source_name: "Reader submission"
  # Top tier: a submitted link competes on equal footing with a primary source
  # for whatever slots are left once the reserved ones are seated, and its
  # priority is still what orders submissions against each other.
  priority: 7
  max_per_run: 20

  # How many of the edition's `max_items` slots submissions hold by right.
  # Empty (the default) reserves a slot for every submission the run has, up to
  # `max_items`: three submissions become three reserved slots and seven earned
  # ones. Set it to a number to cap the reserved share, or to 0 to switch the
  # guarantee off entirely, after which a submitted link is back to competing on
  # its score like everything else.
  #
  # A reserved slot bypasses exactly the rules that ration scarce slots between
  # competing stories -- min_score, max_per_source, max_per_subject and the
  # section limits -- because a submission is not competing for its slot.
  # It bypasses nothing that protects correctness: the three deduplication
  # passes, both event-collapse passes, the "printed only once" guarantee across
  # editions, the entity-fidelity guard, excluded_categories and max_items all
  # still apply, and a submitted link that any of them refuses is named in the
  # run manifest so an empty reserved slot can be accounted for.
  #
  # Set to half the edition rather than left empty. Empty means "every pending
  # submission, up to max_items", and the intake form authenticates nobody, so
  # one enthusiastic or hostile submitter could take all ten slots and the rubric
  # would print nothing. Five keeps submissions decisively ahead of the rubric --
  # they still bypass every cap and every score floor -- while leaving half the
  # newspaper to the week's actual news. Raise it if a week ever deserves it.
  reserved_slots: 5
  require_https: true
  blocked_hosts: []

  # Where readers propose a link from the edition itself. `python -m newsletter
  # serve` answers on http://127.0.0.1:8765/submit; set this to whatever address
  # that server is reachable at for the people who read the newspaper. While it
  # is empty the edition prints no call to action, because an intake nobody can
  # reach is worse than no invitation.
  form_url: "http://127.0.0.1:8765/submit"

  # A post is usually a pointer rather than the story. Below min_text_chars of
  # readable text, the page's own outbound link is followed and what it points
  # at is attached for the analyst to judge. Python picks the link from the
  # page's markup; the model never chooses what to fetch.
  follow_links: true
  min_text_chars: 600
  max_link_hops: 3
  max_linked_chars: 8000

# Defaults for values that the environment may override
# (OPENAI_API_KEY, OPENAI_ANALYZER_MODEL, OPENAI_EDITOR_MODEL,
#  NEWSLETTER_DB_PATH, NEWSLETTER_OUTPUT_DIR, LOG_LEVEL,
#  NEWSLETTER_ANALYSIS_CONCURRENCY, NEWSLETTER_FETCH_CONCURRENCY).
runtime:
  db_path: "newsletter.sqlite"
  output_dir: "output"
  analyzer_model: "gpt-4.1-mini"
  editor_model: "gpt-4.1"
  log_level: "INFO"
  request_timeout_seconds: 60
  max_retries: 2
  # How much of the run happens at once. Both stages are network-bound and
  # ordered afterwards, so raising these changes only how long a run takes --
  # never what it publishes. Set either to 1 to go back to one call at a time.
  analysis_concurrency: 8
  # Lower, because these requests all land on one origin at a time.
  fetch_concurrency: 6

  # How ingestion trusts a TLS certificate. Both settings are OFF here, and off
  # is the standard secure context: the system trust store, RFC 5280 strict
  # validation, hostname checking.
  #
  # They exist for one situation, and it is worth stating plainly so nobody
  # reaches for them as a shortcut. On a corporate network that does TLS
  # inspection -- a FortiGate, a Zscaler, any middlebox that terminates and
  # re-signs HTTPS -- every certificate the engine sees is issued by the
  # appliance's own CA. That CA is genuinely installed in the machine trust
  # store, so the chain builds; what fails is that its certificate predates
  # RFC 5280's Authority Key Identifier requirement, and Python 3.13 turned
  # ssl.VERIFY_X509_STRICT on by default. The symptom is 12 of 14 sources failing
  # with "unable to get local issuer certificate" on a network where a browser
  # loads the same pages without complaint.
  #
  # NEITHER SETTING SKIPS VERIFICATION. There is no key here that turns
  # certificate verification or hostname checking off, and the code that builds
  # the context refuses to return one that has either disabled. relax_x509_strict
  # waives the strict FORMATTING rules only: the chain must still build to a
  # trusted root and the hostname must still match.
  tls:
    # An extra CA bundle in PEM form, trusted in addition to the system store.
    # Empty means the system store alone. Point it at the appliance CA export
    # when that CA is not installed machine-wide.
    ca_bundle: ""
    # Set to true only on such a network, and preferably per-machine rather than
    # committed: it is a property of where the engine runs, not of the engine.
    relax_x509_strict: false
