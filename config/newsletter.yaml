# Editorial policy. Cadence and thresholds are configuration, not architecture.

newsletter:
  masthead: "Leader Intelligence Semanal"
  tagline: "YouTube, contenido infantil e inteligencia artificial, cada semana"

  # IANA timezone used for the date window, issue labels and published dates.
  timezone: "America/Argentina/Buenos_Aires"

  # Default window: the 7 days up to execution time.
  #   rolling         -> [now - window_days, now)
  #   completed_days  -> whole local days only, ending at midnight today
  window_days: 7
  window_mode: rolling

  # Deterministic selection. The model never changes these.
  max_items: 8
  # Recalibrated for the v2 rubric, which asks what a story means for THIS
  # company rather than for a general tech reader. Across 43 real articles the
  # old rubric topped out at 88 and the new one at 68, so 70 published nothing.
  # 62 fills the edition from the genuinely most relevant stories (ADR-0032).
  min_score: 62

  # Collapse several articles covering the same event into one story, using the
  # analyzer event fingerprint (subject + action + object + date).
  collapse_events: true

  # No single publication may fill the edition, however well it scores.
  max_per_source: 2

  # Caps that stop one topic monopolising the edition.
  # Weighted towards what this company lives on: YouTube and children's
  # content first, AI tooling second, general AI business last.
  section_limits:
    youtube_platform: 3
    youtube_monetization: 3
    kids_content: 3
    ai_video: 3
    ai_models: 2
    ai_business: 2

  # Publication order of the sections.
  section_order:
    - youtube_platform
    - youtube_monetization
    - kids_content
    - ai_video
    - ai_models
    - ai_business

  section_titles:
    youtube_platform: "YouTube: la plataforma"
    youtube_monetization: "YouTube: monetización"
    kids_content: "Contenido infantil y familiar"
    ai_video: "IA para video y creatividad"
    ai_models: "Herramientas y modelos de IA"
    ai_business: "IA en los negocios"

  # Valid classification, never published.
  excluded_categories:
    - other

# Reader submissions: anyone can propose a link with
#   python -m newsletter submit <url> --by "name" --note "why"
# A submission is fetched, normalized, deduplicated, assessed and scored exactly
# like any other article. Submitting buys consideration, never publication.
submissions:
  enabled: true
  source_name: "Reader submission"
  # Top tier: a submitted link competes on equal footing with a primary source.
  # It still has to clear min_score on the rubric like everything else.
  priority: 7
  max_per_run: 20
  require_https: true
  blocked_hosts: []

  # A post is usually a pointer rather than the story. Below min_text_chars of
  # readable text, the page's own outbound link is followed and what it points
  # at is attached for the analyst to judge. Python picks the link from the
  # page's markup; the model never chooses what to fetch.
  follow_links: true
  min_text_chars: 600
  max_link_hops: 3
  max_linked_chars: 8000

# Defaults for values that the environment may override
# (OPENAI_API_KEY, OPENAI_ANALYZER_MODEL, OPENAI_EDITOR_MODEL,
#  NEWSLETTER_DB_PATH, NEWSLETTER_OUTPUT_DIR, LOG_LEVEL).
runtime:
  db_path: "newsletter.sqlite"
  output_dir: "output"
  analyzer_model: "gpt-4.1-mini"
  editor_model: "gpt-4.1"
  log_level: "INFO"
  request_timeout_seconds: 60
  max_retries: 2
